services:
  mongodb:
    image: mongo:7
    container_name: thinkz_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - thinkz_network
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thinkz_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - thinkz_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinkz_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - thinkz_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_PATH: ""
    container_name: thinkz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - thinkz_network

networks:
  thinkz_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
